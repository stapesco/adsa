name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch: # allow manual run

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
      - run: npm ci
      - run: npm test
      - run: npm run build

  publish:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          registry-url: "https://registry.npmjs.org"
      - run: npm ci
      - run: npm run build
      - run: npm test
      # Trusted publishing via OIDC. No long-lived npm token required.
      # Configure the trust relationship once at:
      #   https://www.npmjs.com/package/stapes-adsa/access
      #   → "Add a trusted publisher" → GitHub Actions
      #   → owner=stapesco, repo=adsa, workflow=release.yml
      # npm 9.5+ detects the OIDC token automatically and publishes with provenance.
      - run: npm publish --provenance --access public
      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/**/*.js
            dist/**/*.d.ts
            LICENSE
            README.md
            SKILL.md
            AGENTS.md
